{{- $dest := partial "utm-url.html" (dict "url" .Destination "page" .Page) -}}
{{- $isExternal := partial "is-external-url.html" $dest -}}
<a href="{{ $dest }}"
  {{- with .Title }} title="{{ . }}"{{ end }}
  {{- if $isExternal }} target="_blank" rel="noopener noreferrer"{{ end }}
>{{ .Text | safeHTML }}</a>
